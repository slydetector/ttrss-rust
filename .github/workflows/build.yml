# CI — build on every push/PR to main.
#
# Three concurrent jobs, each on its own hosted runner (stock image, official
# actions). Hosted runners are ephemeral: Swatinem/rust-cache and the BuildKit
# GHA layer cache carry build state between runs.
#   test:   the nextest suite (debug) against a postgres service
#   lint:   rustfmt + clippy (restore-only cache, shared key with test)
#   image:  the docker image (the release build happens in-container) + the
#           Playwright e2e golden path. Runs concurrent with test + lint,
#           but the publish polls for both to finish green first — on main,
#           ttrss-rust:latest is only pushed after ALL three gates passed,
#           so `latest` is always a fully green run.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The publish's gate poll (`gh run view`) needs actions:read, which the
# token does not get under the "read contents only" default — declare it
# explicitly so the poll never depends on the repo's permissions setting.
permissions:
  actions: read
  contents: read

# Serialize per ref so concurrent runs of the same ref don't fight over the
# shared caches. Different refs may build in parallel.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Phase 2: the DB-backed integration suite. test-db uses TTRSS_TEST_PG_URL
    # when set (instead of spinning its own testcontainers postgres). A
    # non-container job reaches the published service port on localhost.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Memory-backed data dir — the test-db crate does the same when it
        # starts its own postgres (crates/test-db/src/lib.rs:88).
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
    env:
      TTRSS_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          # The build reads plugin assets from the tt-rss reference submodule
          # via include_str! — same dependency `make bootstrap` covers locally.
          submodules: recursive
      # The stock runner image ships toolchains we don't use; dropping them
      # frees several GB (actions/virtual-environments#709).
      # The toolchain install (dtolnay re-downloads rust every run); the key
      # changes when the version below changes.
      - uses: actions/cache@v6
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # dtolnay needs an explicit toolchain input: derive the channel from
      # rust-toolchain.toml so that file stays the single source of truth.
      - name: Read toolchain version
        id: tc
        run: |
          echo "tc=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.tc.outputs.tc }}
      # The committed .cargo/config.toml links through clang + mold.
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: nextest
      # apt's .deb archive + package lists (the apt steps below): the
      # download is the mirror-speed variable (25.9 MB once took 8m18s at
      # 52 kB/s); warm, apt uses the local archive and only unpacks (~10 s).
      # The runner image ships with pre-seeded apt lists (restore's tar
      # chokes on "File exists") and both dirs are root-owned (tar cannot
      # utime/write as the runner user) — clear them and hand them to the
      # runner user so the restore below can extract.
      - name: Prepare apt dirs for cache restore
        run: |
          sudo rm -rf /var/lib/apt/lists /var/cache/apt/archives
          sudo mkdir -p /var/lib/apt/lists /var/cache/apt/archives
          sudo chown -R "$(whoami)" /var/lib/apt/lists /var/cache/apt/archives
      - uses: actions/cache@v6
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-ubuntu-24.04
      # The importdb integration test shells out to pg_dump|pg_restore. The
      # runner's stock client is 16; the service above is 17 (the product's
      # version), and pg_dump aborts on a newer server — so install the 17
      # client (pgdg).
      - name: Postgres 17 client
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /etc/apt/keyrings/pgdg.asc
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # actions/cache tars the apt dirs as the runner user: apt's lock
          # files are root 600/700, so make the tree readable or the save fails.
          sudo chmod 644 /var/cache/apt/archives/lock /var/lib/apt/lists/lock
          sudo chmod 755 /var/cache/apt/archives/partial /var/lib/apt/lists/partial
          # The runner's /usr/bin/pg_dump(+pg_restore) are postgresql-common's
          # pg_wrapper and resolve to the image's 16 client; put 17's bin dir
          # first on PATH for all following steps (the fix in
          # meggarmind/RESIDIO#958 and pavelprokes/g-gallery#50 — pgdg noble
          # installs the per-version binaries under /usr/lib/postgresql/17).
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -q " 17\." || { echo "pg_dump 17 missing"; exit 1; }
          PATH=/usr/lib/postgresql/17/bin:$PATH pg_dump --version
      # Cargo cache (registry + target). Saved only from main — branch
      # caches get evicted under the 10 GB budget before they're useful.
      # shared-key + no job-id in the key: the lint job restores this same
      # cache entry (and saves nothing, so main stores exactly one).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ttrss
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Full suite: lib tests + the DB-backed integration binaries
      # (postgres service above).
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # include_str! plugin assets, same as test.
          submodules: recursive
      # The toolchain install (dtolnay re-downloads rust every run); the key
      # follows rust-toolchain.toml, so a version bump busts it automatically.
      - uses: actions/cache@v6
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # dtolnay needs an explicit toolchain input: derive the channel from
      # rust-toolchain.toml so that file stays the single source of truth.
      - name: Read toolchain version
        id: tc
        run: |
          echo "tc=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.tc.outputs.tc }}
          components: clippy, rustfmt
      # mold: clippy links build scripts (the .cargo/config.toml rustflags
      # apply to them), so it needs the linker too.
      - uses: rui314/setup-mold@v1
      # Restore-only (save-if: false): main's test job is the single saver,
      # so the 10 GB budget holds one rust-cache entry.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ttrss
          add-job-id-key: false
          save-if: false
      # Pure rustfmt defaults (no config file) — the tree is kept fmt-clean.
      - run: cargo fmt --all -- --check
      - run: make clippy

  image:
    runs-on: ubuntu-latest
    env:
      # Publishing identity — registry host+namespace / user / token, all
      # from secrets, none of it in the repo (docs/19); an unset REGISTRY
      # (fork PRs) skips the publish.
      REGISTRY: ${{ secrets.REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The Dockerfile copies plugin assets from the tt-rss reference
          # submodule (include_str! in the crate sources).
          submodules: recursive
      # The image job's peak (buildkit layers + base images + the GHA cache
      # tar) exceeds the 13 GB the runner starts with free, so drop the
      # 5.8 GB dotnet install (probe-measured: ~15 s to delete, ~7 s to walk).
      # /usr/local/lib/android (12 GB, ~1 min to delete) is the fallback if
      # the margin proves insufficient.
      - name: Free runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet
          df -h / | tail -1
      # The runner's compose plugin predates compose build's attestation
      # flags (--provenance/--sbom — b414656); the suite passes them, and
      # they keep `latest` a plain image. The official latest binary wins
      # over the plugin (cli-plugins dir is first on the plugin search
      # path).
      - name: Docker Compose (official, latest)
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" -o "$HOME/.docker/cli-plugins/docker-compose"
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      # Chromium (the bulk of the next step's time) across runs; the lock
      # hash in the key invalidates it on a Playwright version bump.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-pw${{ hashFiles('e2e/package-lock.json') }}
      # apt's .deb archive + package lists (the apt steps below): the
      # download is the mirror-speed variable (25.9 MB once took 8m18s at
      # 52 kB/s); warm, apt uses the local archive and only unpacks (~10 s).
      # The runner image ships with pre-seeded apt lists (restore's tar
      # chokes on "File exists") and both dirs are root-owned (tar cannot
      # utime/write as the runner user) — clear them and hand them to the
      # runner user so the restore below can extract.
      - name: Prepare apt dirs for cache restore
        run: |
          sudo rm -rf /var/lib/apt/lists /var/cache/apt/archives
          sudo mkdir -p /var/lib/apt/lists /var/cache/apt/archives
          sudo chown -R "$(whoami)" /var/lib/apt/lists /var/cache/apt/archives
      - uses: actions/cache@v6
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-ubuntu-24.04
      # Playwright: node_modules from the lock file + chromium and its apt
      # deps (both cached/installed above — the step is a no-op when warm).
      - name: Playwright
        working-directory: e2e
        run: |
          rm -rf node_modules
          npm ci
          npx playwright install --with-deps chromium
          # actions/cache tars the apt dirs as the runner user: apt's lock
          # files are root 600/700, so make the tree readable or the save fails.
          sudo chmod 644 /var/cache/apt/archives/lock /var/lib/apt/lists/lock
          sudo chmod 755 /var/cache/apt/archives/partial /var/lib/apt/lists/partial
      # The image (what `make image` builds) with the BuildKit GHA layer
      # cache: unchanged layers (base image, sources, the in-container cargo
      # build) restore across runs, so a push that doesn't touch
      # Cargo.lock skips the release compile entirely.
      # The 2026-era hosted runners no longer expose ACTIONS_CACHE_URL /
      # ACTIONS_RUNTIME_TOKEN to step shells, and without them buildx
      # SILENTLY drops `type=gha` cache entries (isActive check in
      # docker/buildx build/opt.go). This action restores the variables.
      - uses: crazy-max/ghaction-github-runtime@v3
      # The daemon's embedded buildkit (docker driver) cannot EXPORT a
      # remote layer cache, so the build runs on a docker-container
      # builder; --load lands the image in the daemon for the e2e step.
      - name: Build ttrss-rust
        run: |
          docker buildx create --name gha --driver docker-container
          # Two tags: the ghcr name is what the blessed compose (and e2e)
          # reference, so the suite tests THIS code, not the last published
          # image; the bare name feeds make image-push.
          docker buildx build --builder gha --provenance=false --sbom=false --load \
            -t ttrss-rust:latest \
            -t ghcr.io/slydetector/ttrss-rust:latest \
            --cache-from type=gha,cache-key=ttrss-image \
            --cache-to type=gha,cache-key=ttrss-image,mode=max \
            .
      # Playwright golden path: the suite's compose project (ttrss-e2e,
      # port 19000) runs in the runner's own daemon; chromium reaches the
      # app at 127.0.0.1:19000 (no container indirection, so no
      # TTRSS_E2E_HOST). The suite's `docker compose build` reuses the
      # daemon's BuildKit cache from the step above — a re-tag, not a
      # recompile.
      - name: e2e (golden path)
        run: make e2e
      # Trace + video + console/page transcripts for a failed golden path.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
      # Full-gate publish: test + lint ran concurrent with this job, so
      # poll the run's jobs (10 s ticks, 30 min cap — test finishes in
      # ~7 min) until both are done. Only then is a green run complete
      # (their pass + this job's e2e), and only then does `latest` move.
      # Polling only happens when a publish would occur (secrets present).
      - name: Wait for test + lint
        if: env.REGISTRY != ''
        env:
          # gh looks for GH_TOKEN specifically in workflows (GITHUB_TOKEN
          # alone is not picked up).
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 180); do
            line=$(gh run view "$GITHUB_RUN_ID" --json jobs --jq \
              '[.jobs[] | select(.name=="test" or .name=="lint")]
               | map(.conclusion | if . == "" then "running" else . end)
               | sort | join(",")')
            case "$line" in
              success,success) echo "test + lint green"; exit 0;;
              *failure*|*cancelled*|*timed_out*|*stale*)
                echo "gate failed: $line" >&2; exit 1;;
            esac
            echo "$line — waiting"
            sleep 10
          done
          echo "timed out (30 min) waiting for test + lint" >&2
          exit 1
      # Publish only when the registry secrets exist (main pushes; fork PRs
      # have none) — and only after e2e + test + lint passed, so `latest`
      # always points at a fully green run. The image above is tagged +
      # pushed as-is.
      - name: Publish ttrss-rust
        if: env.REGISTRY != ''
        run: |
          # Login only when the registry asks for it — an empty
          # REGISTRY_PASSWORD means the registry accepts anonymous push.
          if [ -n "$REGISTRY_PASSWORD" ]; then
            echo "$REGISTRY_PASSWORD" | docker login \
              "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          fi
          make image-push REGISTRY="$REGISTRY"
