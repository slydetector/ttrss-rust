# CI — build on every push/PR to main.
#
# GitHub-Actions-canonical on purpose: this file runs unmodified on both the
# temporary self-hosted runner (label "ubuntu-latest") and the permanent
# GitHub home (runs-on: ubuntu-latest is a hosted pool there). Keep it that
# way: official actions only, stock Docker images, no host-specific syntax.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Same toolchain image as shadow/Dockerfile (rustc 1.98 on trixie).
    container:
      image: rust:1.98-trixie
      # Persistent build state. The runner's docker daemon (dind) has a
      # host-backed /ci-cache dir, so these bind mounts survive between
      # runs: the cargo target dir and registry stay warm on the host SSD,
      # no cache download/extract/save, each run writes only the build delta
      # (cargo fingerprints encode Cargo.lock, so a warm target stays
      # correct when deps change). On GitHub-hosted runners the host paths
      # are created per job (ephemeral) and actions/cache (below) carries
      # the state — same file, both hosts. The target dir is a fixed
      # path (via CARGO_TARGET_DIR below), independent of the workspace
      # layout.
      volumes:
        - /ci-cache/cargo-target:/cargo-target
        - /ci-cache/cargo-home:/cargo-home
        # The suite's compose stack runs in the RUNNER'S daemon (this
        # one): the job container gets the daemon's socket. On
        # GitHub-hosted runners the same mount reaches the runner's own
        # (dind) daemon.
        - /var/run/docker.sock:/var/run/docker.sock
    # Serialize per ref so concurrent runs of the same ref don't write the
    # shared volume at once. Different refs may build in parallel; cargo's
    # file locks keep that safe.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    # Phase 2: the DB-backed integration suite. test-db uses TTRSS_TEST_PG_URL
    # when set (instead of spinning its own testcontainers postgres), so the
    # full `cargo test` runs against this service on both hosts.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Memory-backed data dir — the test-db crate does the same when it
        # starts its own postgres (crates/test-db/src/lib.rs:88).
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
    env:
      # Build artifacts live outside the workspace at a stable mount point (see the container
      # volumes above). CARGO_HOME moves the cargo registry off the image's baked-in
      # /usr/local/cargo so the mount doesn't shadow the rustup/cargo binaries.
      CARGO_TARGET_DIR: /cargo-target
      CARGO_HOME: /cargo-home
      # Host = the service NAME (not localhost): this runner publishes
      # service ports to the runner host, so the job container reaches the
      # DB over the shared docker network alias. GitHub resolves the service
      # name too, so the file stays portable.
      TTRSS_TEST_PG_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      # Publishing identity — registry host+namespace / user / token, all from
      # secrets, none of it in the repo (docs/19). Same secret names on both
      # CI homes; an unset REGISTRY (local runs, fork PRs) skips the publish.
      REGISTRY: ${{ secrets.REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      # Toolchain gaps the stock image leaves for us:
      # - JS actions (like checkout) need node in the job container: GitHub
      #   injects it, the act-based self-hosted runner does not.
      # - the rust:1.98 image lacks clippy + rustfmt (shadow/Dockerfile never
      #   needed them; the fmt gate needs the latter).
      # - zstd: actions/cache falls back to single-threaded gzip (tar -z)
      #   without it; with it, cache save/restore is multi-threaded.
      # - postgresql-client: the importdb integration test runs the binary
      #   on the host, which shells out to pg_dump|pg_restore (the image
      #   ships them; the CI job container must too).
      # Each install is a no-op when the piece already exists, so the file
      # stays portable to GitHub.
      - name: Ensure build toolchain (node + clippy + rustfmt)
        run: |
          # Debian's nodejs package lacks npm/npx — the npm package supplies both.
          command -v node >/dev/null 2>&1 && command -v npx >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends nodejs npm)
          command -v zstd >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends zstd)
          command -v pg_dump >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends postgresql-client)
          # docker CLI for the e2e step (daemon = the runner's, via the
          # mounted socket; on trixie the client is the `docker-cli`
          # package); iproute2 for the gateway lookup.
          command -v docker >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends docker-cli iproute2)
          # Official compose, latest release (the trixie apt plugin is older).
          mkdir -p /root/.docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" -o /root/.docker/cli-plugins/docker-compose
          chmod +x /root/.docker/cli-plugins/docker-compose
          rustup component add clippy rustfmt
      - uses: actions/checkout@v4
        with:
          # The build reads plugin assets from the tt-rss reference submodule
          # via include_str! — same dependency `make bootstrap` covers locally.
          submodules: recursive
      # Cargo cache across runs: registry + target, keyed on Cargo.lock
      # (JS action — node is handled by the ensure step above). Skipped on
      # the act runner (ACT=true): there the container volumes above are
      # persistent and already warm.
      - uses: actions/cache@v4
        if: env.ACT != 'true'
        with:
          path: |
            /cargo-home/registry
            /cargo-home/git
            /cargo-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release -p ttrss --bin ttrss
      # Pure rustfmt defaults (no config file) — the tree is kept fmt-clean.
      - run: cargo fmt --all -- --check
      # Full suite: lib tests + the DB-backed integration binaries
      # (postgres service above).
      - run: cargo test
      - name: Playwright (chromium + deps)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Headless golden path: the suite's compose project (ttrss-e2e, port
      # 19000) runs in the runner's daemon (socket mounted above); chromium
      # (here) reaches the app's published port over the job network's
      # gateway — the host's own IP on that subnet.
      - name: e2e (golden path)
        run: |
          # Published ports land on the host; reach them via the job
          # network's gateway (the host's IP on that subnet).
          export TTRSS_E2E_HOST=$(ip route | awk '/default/ {print $3; exit}')
          make e2e
      - run: cargo clippy --workspace --all-targets
      # Publish the image to the registry named by the secrets above
      # (skipped when REGISTRY is unset). The image was already built by
      # the e2e step (same Dockerfile) — this only tags + pushes it
      # (make image-push).
      - name: Publish ttrss-rust
        if: env.REGISTRY != ''
        run: |
          # Login only when the registry asks for it — an empty
          # REGISTRY_PASSWORD means the registry accepts anonymous push.
          if [ -n "$REGISTRY_PASSWORD" ]; then
            echo "$REGISTRY_PASSWORD" | docker login \
              "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          fi
          make image-push REGISTRY="$REGISTRY"
