[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "multipart"] }
base64 = "0.22"
base32 = "0.5"
chrono = { version = "0.4", features = ["serde", "clock"] }
ctor = "1"
flate2 = "1.1"
minijinja = "2"
chrono-tz = "0.10"
croner = "4.0"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
iana-time-zone = "0.1"
libc = "0.2"
icu_plurals = "2"
icu_locale_core = "2"
md5 = "0.7"
mime_guess = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "json"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "compression-zstd"] }
testcontainers = { version = "0.27", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
scraper = "0.21"
kuchikiki = "0.8"
html5ever = "0.26"
ego-tree = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha1 = "0.10"
sha2 = "0.10"
quick-xml = { version = "0.42", features = ["serialize"] }
roxmltree = "0.21"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico"] }
png = "0.18"
urlencoding = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
toml = "0.8"
url = "2"
idna = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
