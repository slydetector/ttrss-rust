# Shadow-prod stack: a copy of a production tt-rss DB + the Rust server against
# it. See docs/shadow-prod.md. No nginx / no PHP / no updater — the Rust server
# is self-contained (static assets + dynamic routes in-process).
#
# Reads shadow/.env (gitignored) for PROD creds + options. Options reuse the
# app's own TTRSS_* / RUST_LOG names (plus SHADOW_PORT / SHADOW_DB_PORT for
# the host ports) and have defaults so the stack runs with a minimal .env.
name: ttrss-shadow

services:
  db:
    image: postgres:17-alpine
    # Run as the invoking host user (the official image's "arbitrary users"
    # mode): the bind mount needs no chown, and all DB files end up owned by
    # the host user for easy inspection.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      POSTGRES_USER: ${TTRSS_DB_USER:-shadow}
      POSTGRES_PASSWORD: ${TTRSS_DB_PASS:-shadow}
      POSTGRES_DB: ${TTRSS_DB_NAME:-shadow}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "${SHADOW_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        RUST_IMAGE: rust:1.98-trixie
    image: ttrss-shadow-rust
    # Profiling: lets `docker exec -u root shadow-app-1 cat /proc/1/smaps_rollup`
    # etc. work (default caps omit SYS_PTRACE; the app drops to uid 1000, so
    # same-uid reads are denied too — docs/10-shadow-prod.md "memory profiling").
    cap_add:
      - SYS_PTRACE
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The rest (TTRSS_DB_HOST/PORT, TTRSS_LISTEN_ADDR, TTRSS_PLUGINS,
      # RUST_LOG, OWNER_UID/GID) are image defaults (Dockerfile ENV).
      TTRSS_DB_USER: ${TTRSS_DB_USER:-shadow}
      TTRSS_DB_NAME: ${TTRSS_DB_NAME:-shadow}
      TTRSS_DB_PASS: ${TTRSS_DB_PASS:-shadow}
      TTRSS_SELF_URL_PATH: ${TTRSS_SELF_URL_PATH:-http://127.0.0.1:9000/tt-rss/}
      TTRSS_ENCRYPTION_KEY: ${TTRSS_ENCRYPTION_KEY:-9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08}
      # Debug the app's own modules without sqlx noise (same value `make run` uses).
      RUST_LOG: ${RUST_LOG:-info}
      # Daemon load knobs (image defaults shown); e.g.
      #   TTRSS_DAEMON_SLEEP_INTERVAL=30 TTRSS_DAEMON_FEED_LIMIT=400 TTRSS_DAEMON_MAX_JOBS=8 make shadow
      # to soak the updater (full 365-feed sweep every ~3 min).
      TTRSS_DAEMON_SLEEP_INTERVAL: ${TTRSS_DAEMON_SLEEP_INTERVAL:-120}
      TTRSS_DAEMON_FEED_LIMIT: ${TTRSS_DAEMON_FEED_LIMIT:-50}
      TTRSS_DAEMON_MAX_JOBS: ${TTRSS_DAEMON_MAX_JOBS:-2}
    ports:
      - "${SHADOW_PORT:-9000}:9000"
    volumes:
      - ./data/tt-rss:/var/lib/tt-rss
