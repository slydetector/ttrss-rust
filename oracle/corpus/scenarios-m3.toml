# M3 corpus: article-state mutations (Mutations I).
#
# Each step performs an `RPC` mutation against the shared DB and captures the
# resulting DB state (`db_state`) so the harness can compare the Rust server's
# writes against the PHP oracle's writes. The steps are cumulative (each runs
# on the state left by the previous), so the oracle and Rust runs must start
# from the same baseline: restore `golden-db.sql` before EACH run.
#
# Run with:
#   TTRSS_HARNESS_DB=postgres://postgres:password@127.0.0.1:5432/postgres \
#     tt-rust-harness run --base-url http://127.0.0.1:8280/tt-rss \
#       --scenarios oracle/corpus/scenarios-m3.toml \
#       --vars oracle/data/ids.json --out <run-dir>
#
# The `db_state` snapshot is the read/star/publish boolean state of every entry
# for the admin (uid 1), one row per entry, ordered by entry id.

base_url = "http://127.0.0.1:8280/tt-rss"

# ------------------------------------------------------------------- login ---

[[step]]
name = "m3_login"
method = "POST"
path = "/public.php"
query = [ ["return", "{{base}}/index.php"] ]
form = [ ["op", "login"],
         ["login", "{{admin.login}}"],
         ["password", "{{admin.password}}"] ]
expect_status = 302

[[step]]
name = "m3_shell"
path = "/index.php"
expect_status = 200
save = { csrf = 'regex:const __csrf_token = "([0-9a-f]{32})"' }

# ------------------------------------------------------------- mutations ----
# A small fixed set of entry ids (2, 3 are the first Ars Technica entries; the
# corpus `article_1`/`article_2` give two more) so both runs mutate the same rows.

[[step]]
name = "m3_catchup_read"
method = "POST"
path = "/backend.php"
form = [ ["op", "RPC"], ["method", "catchupSelected"],
         ["ids", "2,3,{{article_1}}"], ["cmode", "0"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT ref_id, unread, marked, published FROM ttrss_user_entries WHERE owner_uid = 1 ORDER BY ref_id"

[[step]]
name = "m3_catchup_unread"
method = "POST"
path = "/backend.php"
form = [ ["op", "RPC"], ["method", "catchupSelected"],
         ["ids", "2,3,{{article_1}}"], ["cmode", "1"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT ref_id, unread, marked, published FROM ttrss_user_entries WHERE owner_uid = 1 ORDER BY ref_id"

[[step]]
name = "m3_catchup_toggle"
method = "POST"
path = "/backend.php"
form = [ ["op", "RPC"], ["method", "catchupSelected"],
         ["ids", "2,3,{{article_1}}"], ["cmode", "2"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT ref_id, unread, marked, published FROM ttrss_user_entries WHERE owner_uid = 1 ORDER BY ref_id"

[[step]]
name = "m3_mark_star"
method = "POST"
path = "/backend.php"
form = [ ["op", "RPC"], ["method", "markSelected"],
         ["ids", "2,{{article_2}}"], ["cmode", "1"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT ref_id, unread, marked, published FROM ttrss_user_entries WHERE owner_uid = 1 ORDER BY ref_id"

[[step]]
name = "m3_mark_unstar"
method = "POST"
path = "/backend.php"
form = [ ["op", "RPC"], ["method", "markSelected"],
         ["ids", "2,{{article_2}}"], ["cmode", "0"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT ref_id, unread, marked, published FROM ttrss_user_entries WHERE owner_uid = 1 ORDER BY ref_id"

[[step]]
name = "m3_mark_toggle"
method = "POST"
path = "/backend.php"
form = [ ["op", "RPC"], ["method", "markSelected"],
         ["ids", "2,{{article_2}}"], ["cmode", "2"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT ref_id, unread, marked, published FROM ttrss_user_entries WHERE owner_uid = 1 ORDER BY ref_id"

[[step]]
name = "m3_publish"
method = "POST"
path = "/backend.php"
form = [ ["op", "RPC"], ["method", "publishSelected"],
         ["ids", "3,{{article_1}}"], ["cmode", "1"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT ref_id, unread, marked, published FROM ttrss_user_entries WHERE owner_uid = 1 ORDER BY ref_id"

[[step]]
name = "m3_unpublish"
method = "POST"
path = "/backend.php"
form = [ ["op", "RPC"], ["method", "publishSelected"],
         ["ids", "3,{{article_1}}"], ["cmode", "0"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT ref_id, unread, marked, published FROM ttrss_user_entries WHERE owner_uid = 1 ORDER BY ref_id"

# ── Article mutations (setScore / tags / labels / metadata / tags list) ─────
# ref ids: 2, 3 (first Ars Technica entries), 20 = article_1, 429 = article_2.

[[step]]
name = "m3_set_score"
method = "POST"
path = "/backend.php"
form = [ ["op", "Article"], ["method", "setScore"],
         ["ids", "2,3,{{article_1}}"], ["score", "5"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT ref_id, score FROM ttrss_user_entries WHERE owner_uid = 1 AND score <> 0 ORDER BY ref_id"

[[step]]
name = "m3_set_tags"
method = "POST"
path = "/backend.php"
form = [ ["op", "Article"], ["method", "setArticleTags"],
         ["id", "{{article_1}}"], ["tags_str", "harness-test,parity"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT tag_name FROM ttrss_tags WHERE post_int_id IN (SELECT int_id FROM ttrss_user_entries WHERE owner_uid = 1 AND ref_id IN (2,3,20,429)) ORDER BY tag_name"

[[step]]
name = "m3_set_tags_clear"
method = "POST"
path = "/backend.php"
form = [ ["op", "Article"], ["method", "setArticleTags"],
         ["id", "{{article_2}}"], ["tags_str", ""],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT tag_name FROM ttrss_tags WHERE post_int_id IN (SELECT int_id FROM ttrss_user_entries WHERE owner_uid = 1 AND ref_id IN (2,3,20,429)) ORDER BY tag_name"

[[step]]
name = "m3_assign_label"
method = "POST"
path = "/backend.php"
form = [ ["op", "Article"], ["method", "assigntolabel"],
         ["ids", "2,{{article_1}}"], ["lid", "{{labels.Read later}}"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT article_id, label_id FROM ttrss_user_labels2 WHERE article_id IN (2,3,20,429) ORDER BY article_id, label_id"

[[step]]
name = "m3_remove_label"
method = "POST"
path = "/backend.php"
form = [ ["op", "Article"], ["method", "removefromlabel"],
         ["ids", "2,{{article_1}}"], ["lid", "{{labels.Read later}}"],
         ["csrf_token", "{{csrf}}"] ]
expect_status = 200
db_state = "SELECT article_id, label_id FROM ttrss_user_labels2 WHERE article_id IN (2,3,20,429) ORDER BY article_id, label_id"

[[step]]
name = "m3_article_print_tags"
method = "POST"
path = "/backend.php"
form = [ ["op", "Article"], ["method", "printArticleTags"],
         ["id", "{{article_1}}"], ["csrf_token", "{{csrf}}"] ]
expect_status = 200

[[step]]
name = "m3_article_complete_tags"
method = "POST"
path = "/backend.php"
form = [ ["op", "Article"], ["method", "completeTags"],
         ["search", "rust"], ["csrf_token", "{{csrf}}"] ]
expect_status = 200

[[step]]
name = "m3_article_metadata"
method = "POST"
path = "/backend.php"
form = [ ["op", "Article"], ["method", "getmetadatabyid"],
         ["id", "{{article_1}}"], ["csrf_token", "{{csrf}}"] ]
expect_status = 200

[[step]]
name = "m3_article_redirect"
method = "POST"
path = "/backend.php"
form = [ ["op", "Article"], ["method", "redirect"],
         ["id", "{{article_1}}"], ["csrf_token", "{{csrf}}"] ]
expect_status = 302

