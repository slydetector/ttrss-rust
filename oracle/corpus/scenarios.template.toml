# Golden corpus: the request set the oracle (and later the Rust server) must
# answer identically.
#
# Run with:
#   harness run --base-url http://127.0.0.1:8280/tt-rss \
#       --scenarios oracle/corpus/scenarios.template.toml \
#       --vars oracle/data/ids.json --out <run-dir>
#
# Variable sources:
#   --vars ids.json (flattened: {{admin.login}}, {{categories.tech_news}}, ...)
#   live saves:      {{csrf}}, {{csrf_ro}}, {{shell_etag}}, {{api_sid}}
#
# Rules:
#   - reads only; the suite ends with login/logout flows (no data mutations,
#     except the inevitable session rows)
#   - backend.php traffic is form-urlencoded; /api/index.php is JSON
#   - csrf_token is re-derived from the live shell on every run

base_url = "http://127.0.0.1:8280/tt-rss"

# ---------------------------------------------------------------- public ---

[[step]]
name = "healthcheck"
path = "/healthz"
expect_status = 200

[[step]]
name = "login_page"
path = "/index.php"
expect_status = 200

[[step]]
name = "static_svg"
path = "/images/three-dots.svg"
expect_status = 200

# ------------------------------------------------------------------- login ---

# Admin has NO OTP: username/password alone logs in (the frictionless demo
# path). OTP is still supported and exercised later by the dedicated otpuser.

[[step]]
name = "web_login"
method = "POST"
path = "/public.php"
query = [ ["return", "{{base}}/index.php"] ]
form = [ ["op", "login"],
         ["login", "{{admin.login}}"],
         ["password", "{{admin.password}}"] ]
expect_status = 302

[[step]]
name = "shell"
path = "/index.php"
expect_status = 200
save = { csrf = 'regex:const __csrf_token = "([0-9a-f]{32})"', shell_etag = "header:ETag" }

[[step]]
name = "shell_conditional"
path = "/index.php"
headers = [ ["If-None-Match", "{{shell_etag}}"] ]
expect_status = 304

[[step]]
name = "prefs_page"
path = "/prefs.php"
expect_status = 200

