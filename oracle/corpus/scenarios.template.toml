# -------------------------------------------------------------- external ---
# API level 23 (JSON). api_sid is auto-injected into all subsequent calls.

[[step]]
name = "api_login"
method = "POST"
path = "/api/index.php"
# Admin has no OTP now; the API login still exercises the app-password path.
json = { op = "login", user = "{{admin.login}}", password = "{{app_password}}" }
expect_status = 200
save = { api_sid = "json:content.session_id" }

[[step]]
name = "api_is_logged_in"
method = "POST"
path = "/api/index.php"
json = { op = "isloggedin" }
expect_status = 200

[[step]]
