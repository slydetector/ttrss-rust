[[step]]
name = "shell_readonly"
path = "/index.php"
expect_status = 200
save = { csrf_ro = 'regex:const __csrf_token = "([0-9a-f]{32})"' }

[[step]]
name = "readonly_feed_tree"
method = "GET"
path = "/backend.php"
query = [ ["op", "Pref_Feeds"], ["method", "getfeedtree"], ["mode", "2"] ]
expect_status = 200

[[step]]
name = "readonly_headlines"
method = "POST"
path = "/backend.php"
form = [ ["op", "Feeds"], ["method", "view"],
         ["feed", "{{feed_ars}}"], ["m", "all"],
         ["csrf_token", "{{csrf_ro}}"] ]
# Oracle behavior: readonly user does not own this feed, so Feeds::view
# returns the "Feed not found." error-feed JSON (200).
expect_status = 200

[[step]]
name = "logout_readonly"
method = "POST"
path = "/public.php"
form = [ ["op", "logout"], ["csrf_token", "{{csrf_ro}}"] ]
expect_status = 302

# -------------------------------------------------------- otpuser (OTP) user ---
# TOTP is supported (just not on the admin demo path). otpuser has OTP
# enabled: the first POST returns the 200 challenge page, then the live code
# completes the login (302). {{totp:{{totp_secret}}}} computes the code live.
# DISABLED: the OTP login flow is skipped (kept for later re-enablement).
[[step]]
name = "otp_login_challenge"
skip = true
method = "POST"
path = "/public.php"
query = [ ["return", "{{base}}/index.php"] ]
form = [ ["op", "login"],
         ["login", "{{otpuser.login}}"],
         ["password", "{{otpuser.password}}"] ]
expect_status = 200

[[step]]
name = "otp_login_success"
skip = true
method = "POST"
path = "/public.php"
query = [ ["return", "{{base}}/index.php"] ]
form = [ ["op", "login"],
         ["login", "{{otpuser.login}}"],
         ["password", "{{otpuser.password}}"],
         ["otp", "{{totp:{{totp_secret}}}}"] ]
expect_status = 302

[[step]]
name = "shell_otp"
skip = true
path = "/index.php"
expect_status = 200
save = { csrf_otp = 'regex:const __csrf_token = "([0-9a-f]{32})"' }

[[step]]
name = "logout_otp"
skip = true
method = "POST"
path = "/public.php"
form = [ ["op", "logout"], ["csrf_token", "{{csrf_otp}}"] ]
expect_status = 302
