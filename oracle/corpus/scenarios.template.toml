form = [ ["op", "logout"], ["csrf_token", "{{csrf}}"] ]
expect_status = 302

[[step]]
name = "shell_after_logout"
skip = true # flaky
path = "/index.php"
expect_status = 200

[[step]]
name = "web_login_readonly"
method = "POST"
path = "/public.php"
query = [ ["return", "{{base}}/index.php"] ]
form = [ ["op", "login"],
         ["login", "{{readonly.login}}"],
         ["password", "{{readonly.password}}"] ]
