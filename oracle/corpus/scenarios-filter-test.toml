# Filter test dialog corpus: Pref_Filters::testFilterDo (the "Test Filter"
# preview — dry-runs posted rules against the owner's articles, read-only).
#
# Record the oracle baseline, then diff a Rust run against it:
#   oracle/scripts/reset-db.sh
#   harness run --base-url http://127.0.0.1:8280/tt-rss \
#       --scenarios oracle/corpus/scenarios-filter-test.toml \
#       --vars oracle/data/ids.json --out oracle/data/runs/filter-test-oracle
#   oracle/scripts/reset-db.sh
#   oracle/scripts/harness.sh --scenarios oracle/corpus/scenarios-filter-test.toml \
#       --baseline oracle/data/runs/filter-test-oracle --no-build \
#       --out oracle/data/runs/filter-test-rust
#
# The DB reset before EACH run keeps the two runs on the same frozen state
# (logins leave session rows; the previews are a deterministic function of
# the golden entries). `rule[]` carries JSON strings (form-encoded by the
# harness), the exact shape the SPA posts.

base_url = "http://127.0.0.1:8280/tt-rss"

# ------------------------------------------------------------------- login ---

[[step]]
name = "ft_login"
method = "POST"
path = "/public.php"
query = [ ["return", "{{base}}/index.php"] ]
form = [ ["op", "login"],
         ["login", "{{admin.login}}"],
         ["password", "{{admin.password}}"] ]
expect_status = 302

[[step]]
name = "ft_shell"
path = "/index.php"
expect_status = 200
save = { csrf = 'regex:const __csrf_token = "([0-9a-f]{32})"' }

# ------------------------------------------------------------- the rules ---
# Golden-dataset targets: feed 1 (Ars Technica IT, {{feed_ars}}), category 5
# ("rust", {{categories.rust}}), feed 14 (HN front page). `limit` keeps the
# responses small; `reg_exp` values are chosen so both runs hit real
# matches (title/content/author/tag rules, the `.` regex for any-char).

[[step]]
name = "ft_title_all"
method = "POST"
path = "/backend.php"
form = [ ["op", "Pref_Filters"], ["method", "testFilterDo"],
         ["csrf_token", "{{csrf}}"],
         ["offset", "0"], ["limit", "5"],
         ["rule[]", "{\"reg_exp\":\"Rust\",\"filter_type\":1,\"feed_id\":[\"0\"]}"] ]
expect_status = 200

[[step]]
name = "ft_title_feed_scope"
method = "POST"
path = "/backend.php"
form = [ ["op", "Pref_Filters"], ["method", "testFilterDo"],
         ["csrf_token", "{{csrf}}"],
         ["offset", "0"], ["limit", "5"],
         ["rule[]", "{\"reg_exp\":\".\",\"filter_type\":1,\"feed_id\":[\"{{feed_ars}}\"]}"] ]
expect_status = 200

[[step]]
name = "ft_cat_scope"
method = "POST"
path = "/backend.php"
form = [ ["op", "Pref_Filters"], ["method", "testFilterDo"],
         ["csrf_token", "{{csrf}}"],
         ["offset", "0"], ["limit", "5"],
         ["rule[]", "{\"reg_exp\":\".\",\"filter_type\":1,\"feed_id\":[\"CAT:{{categories.rust}}\"]}"] ]
expect_status = 200

[[step]]
name = "ft_content_rule"
method = "POST"
path = "/backend.php"
form = [ ["op", "Pref_Filters"], ["method", "testFilterDo"],
         ["csrf_token", "{{csrf}}"],
         ["offset", "0"], ["limit", "5"],
         ["rule[]", "{\"reg_exp\":\"http\",\"filter_type\":2,\"feed_id\":[\"0\"]}"] ]
expect_status = 200

[[step]]
name = "ft_both_rule"
method = "POST"
path = "/backend.php"
form = [ ["op", "Pref_Filters"], ["method", "testFilterDo"],
         ["csrf_token", "{{csrf}}"],
         ["offset", "0"], ["limit", "5"],
         ["rule[]", "{\"reg_exp\":\"Rust\",\"filter_type\":3,\"feed_id\":[\"0\"]}"] ]
expect_status = 200

[[step]]
name = "ft_match_any_author"
method = "POST"
path = "/backend.php"
form = [ ["op", "Pref_Filters"], ["method", "testFilterDo"],
         ["csrf_token", "{{csrf}}"],
         ["offset", "0"], ["limit", "5"],
         ["match_any_rule", "on"],
         ["rule[]", "{\"reg_exp\":\"zz_no_such_title_zz\",\"filter_type\":1,\"feed_id\":[\"0\"]}"],
         ["rule[]", "{\"reg_exp\":\".\",\"filter_type\":6,\"feed_id\":[\"0\"]}"] ]
expect_status = 200

[[step]]
name = "ft_inverse"
method = "POST"
path = "/backend.php"
form = [ ["op", "Pref_Filters"], ["method", "testFilterDo"],
         ["csrf_token", "{{csrf}}"],
         ["offset", "0"], ["limit", "5"],
         ["inverse", "on"],
         ["rule[]", "{\"reg_exp\":\"zz_no_such_title_zz\",\"filter_type\":1,\"feed_id\":[\"0\"]}"] ]
# PHP: an inverse match leaves an EMPTY highlight word; `Sanitizer::
# highlight_words` then loops forever → the max-execution-time fatal (the
# oracle answers after ~30 s). The Rust port reports the same 500 + empty
# body immediately.
expect_status = 500

[[step]]
name = "ft_inverse_all_match"
method = "POST"
path = "/backend.php"
form = [ ["op", "Pref_Filters"], ["method", "testFilterDo"],
         ["csrf_token", "{{csrf}}"],
         ["offset", "0"], ["limit", "5"],
         ["inverse", "on"],
         ["rule[]", "{\"reg_exp\":\".*\",\"filter_type\":1,\"feed_id\":[\"0\"]}"] ]
# `inverse` of a rule matching every entry → everything excluded → empty
# items (no fatal — no matched entry builds an item).
expect_status = 200

[[step]]
name = "ft_tag_rule"
method = "POST"
path = "/backend.php"
form = [ ["op", "Pref_Filters"], ["method", "testFilterDo"],
         ["csrf_token", "{{csrf}}"],
         ["offset", "0"], ["limit", "5"],
         ["rule[]", "{\"reg_exp\":\"rust\",\"filter_type\":7,\"feed_id\":[\"0\"]}"] ]
expect_status = 200
